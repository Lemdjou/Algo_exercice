version: '3.3'

services:
  postgres:
    image: postgres:16-alpine
    container_name: advision-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-advision_db}
      POSTGRES_USER: ${POSTGRES_USER:-advision_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-advision_password_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./api
    container_name: advision-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-advision_db}
      POSTGRES_USER: ${POSTGRES_USER:-advision_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-advision_password_secret}
      JWT_SECRET: ${JWT_SECRET:-advision_jwt_secret_key_change_in_production}
    depends_on:
      - postgres

volumes:
  postgres_data:
